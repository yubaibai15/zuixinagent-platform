:root {

body {

body::after {

}
.legend {

.legend-item:hover { background: rgba(212,184,120,0.08); }
.legend-dot {

.tooltip {

  '产品适配 Produto': '#ef5a64',
  '转化链路 Conversão': '#a86ee0',
  '桥接层 Pontes': '#2db5ab'
};
const sectionShort = {
  '中心主题': '中心主题',
  '巴西本土文化 Cultura': '文化',
  '私域运营 Relacionamento': '私域运营',
  '产品适配 Produto': '产品适配',
  '转化链路 Conversão': '转化链路',
  '桥接层 Pontes': '桥接层'
};
const sectionCounts = {};
sections.forEach(s => { sectionCounts[s] = rawData.nodes.filter(n => n.section === s).length; });

// ===== SVG Setup =====
const svg = d3.select('#graph');
const width = window.innerWidth, height = window.innerHeight;
svg.attr('viewBox', `0 0 ${width} ${height}`);

// Defs: gradients and filters
const defs = svg.append('defs');

// Glow filter
const glowFilter = defs.append('filter').attr('id', 'glow')
  .attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
glowFilter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'coloredBlur');
const glowMerge = glowFilter.append('feMerge');
glowMerge.append('feMergeNode').attr('in', 'coloredBlur');
glowMerge.append('feMergeNode').attr('in', 'SourceGraphic');

// Radial gradients for each section
sections.forEach(s => {
  const color = sectionColors[s] || '#888';
  const grad = defs.append('radialGradient')
    .attr('id', 'grad-' + s.replace(/[^a-zA-Z0-9]/g, ''))
    .attr('cx', '35%').attr('cy', '35%');
  grad.append('stop').attr('offset', '0%').attr('stop-color', d3.color(color).brighter(0.5));
  grad.append('stop').attr('offset', '100%').attr('stop-color', color);
});

// Arrow markers
['solid', 'dashed'].forEach(type => {
  defs.append('marker')
    .attr('id', 'arrow-' + type)
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 12).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-4L6,0L0,4')
    .attr('fill', type === 'solid' ? '#8a93a3' : '#a986c2');
});

// ===== Build graph =====
const nodes = rawData.nodes.map(d => ({ ...d }));
const links = rawData.links.map(d => ({ ...d }));

// Map for quick lookup
const nodeMap = {};
nodes.forEach(n => { nodeMap[n.id] = n; });

// Compute degree (number of connections) for each node
const degree = {};
links.forEach(l => {
  degree[l.source] = (degree[l.source] || 0) + 1;
  degree[l.target] = (degree[l.target] || 0) + 1;
});
nodes.forEach(n => { n.degree = degree[n.id] || 0; });

// Color scale
function getNodeColor(n) {
  return sectionColors[n.section] || '#888';
}
function getNodeRadius(n) {
  const baseSize = Math.max(6, n.weight * 1.2);
  return Math.min(baseSize + n.degree * 0.3, 38);
}

// Container for zoom
const g = svg.append('g');

// Zoom behavior
const zoom = d3.zoom()
  .scaleExtent([0.15, 5])
  .on('zoom', (event) => { g.attr('transform', event.transform); });
svg.call(zoom);

// ===== Force Simulation =====
// Section centers for radial positioning
const sectionAngles = {};
sections.forEach((s, i) => {
  const angle = (i / sections.length) * 2 * Math.PI - Math.PI / 2;
  sectionAngles[s] = angle;
});

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id)
    .distance(d => d.type === 'dashed' ? 140 : 80)
    .strength(d => d.type === 'dashed' ? 0.15 : 0.5))
  .force('charge', d3.forceManyBody().strength(d => -200 - d.weight * 4))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => getNodeRadius(d) + 4))
  .force('radial', d3.forceRadial(d => {
    if (d.section === '中心主题') return 0;
    return 240 + (90 - d.weight) * 3;
  }, width / 2, height / 2).strength(0.3));

// ===== Links =====
const linkGroup = g.append('g').attr('class', 'links');
const link = linkGroup.selectAll('path')
  .data(links)
  .join('path')
  .attr('class', 'link')
  .attr('stroke', d => {
    if (d.type === 'dashed') return '#a986c2';
    return sectionColors[d.source.section] || '#7a8494';
  })
  .attr('stroke-width', d => d.type === 'dashed' ? 0.9 : 1.4)
  .attr('stroke-opacity', d => d.type === 'dashed' ? 0.16 : 0.32)
  .attr('stroke-dasharray', d => d.type === 'dashed' ? '2,7' : null);

// ===== Nodes =====
const nodeGroup = g.append('g').attr('class', 'nodes');
const node = nodeGroup.selectAll('g.node')
  .data(nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', dragStart)
    .on('drag', dragging)
    .on('end', dragEnd));

// Node circles with gradient
node.append('circle')
  .attr('r', d => getNodeRadius(d))
  .attr('fill', d => {
    const color = getNodeColor(d);
    const gradId = 'grad-' + d.section.replace(/[^a-zA-Z0-9]/g, '');
    return `url(#${gradId})`;
  })
  .attr('stroke', d => d3.color(getNodeColor(d)).brighter(0.6))
  .attr('stroke-width', 1.5)
  .attr('filter', d => d.weight >= 15 ? 'url(#glow)' : null);

// Node labels
const showLabels = { val: true };
node.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => getNodeRadius(d) + 11)
  .text(d => {
    // Shorten long names
    const name = d.name;
    if (name.length > 14) {
      // Try to split at space
      const parts = name.split(' ');
      if (parts.length > 1) {
        return parts[0].slice(0, 8) + '..' + parts[parts.length - 1].slice(-4);
      }
      return name.slice(0, 12) + '..';
    }
    return name;
  })
  .style('display', 'block');

// ===== Legend =====
const legendEl = document.getElementById('legend');
let legendHTML = '<div class="legend-title">板块 / SECTIONS</div>';
const activeSections = new Set(sections);
sections.forEach(s => {
  const color = sectionColors[s] || '#888';
  const short = sectionShort[s] || s;
  legendHTML += `<div class="legend-item" data-section="${s}">
    <span class="legend-dot" style="background:${color};color:${color}"></span>
    <span class="legend-text">${short}</span>
    <span class="legend-count">${sectionCounts[s]}</span>
  </div>`;
});
legendHTML += '<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--text-3)">实线 = 板块内关联 · 虚线 = 跨板块核心联动</div>';
legendEl.innerHTML = legendHTML;

// Legend click toggle
d3.selectAll('.legend-item').on('click', function() {
  const section = this.dataset.section;
  if (activeSections.has(section)) {
    activeSections.delete(section);
    this.classList.add('inactive');
  } else {
    activeSections.add(section);
    this.classList.remove('inactive');
  }
  updateVisibility();
});

// ===== Visibility Control =====
let showSolid = true, showDashed = true, showLabels2 = true;

function updateVisibility() {
  node.style('display', d => activeSections.has(d.section) ? null : 'none');
  link.style('display', d => {
    if (!activeSections.has(d.source.section) && !activeSections.has(d.target.section)) return 'none';
    if (d.type === 'solid' && !showSolid) return 'none';
    if (d.type === 'dashed' && !showDashed) return 'none';
    return null;
  });
}

// ===== Interaction =====
// Hover
node.on('mouseenter', (event, d) => {
  const tooltip = document.getElementById('tooltip');
  const pt = d.portuguese ? `<div class="tt-pt">${d.portuguese}</div>` : '';
  const desc = d.description ? `<div class="tt-desc">${d.description}</div>` : '';
  tooltip.innerHTML = `<div class="tt-name">${d.name}</div>${pt}${desc}<div class="tt-section">${d.section}</div>`;
  tooltip.style.opacity = 1;
  // Highlight connected links in gold
  if (!selectedNode) {
    link.classed('hl', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return sid === d.id || tid === d.id;
    });
  }
})
.on('mousemove', (event) => {
  const tooltip = document.getElementById('tooltip');
  let x = event.clientX + 14;
  let y = event.clientY + 14;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if (x + tw > window.innerWidth) x = event.clientX - tw - 14;
  if (y + th > window.innerHeight) y = event.clientY - th - 14;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
})
.on('mouseleave', () => {
  document.getElementById('tooltip').style.opacity = 0;
  if (!selectedNode) link.classed('hl', false);
});

// Click - highlight connected
let selectedNode = null;
node.on('click', (event, d) => {
  event.stopPropagation();
  if (selectedNode === d) {
    // Deselect
    selectedNode = null;
    node.classed('dimmed', false);
    link.classed('dimmed', false);
    link.classed('hl', false);
    node.select('circle').attr('stroke-width', 1.5);
    document.getElementById('info-panel').classList.remove('show');
    return;
  }
  selectedNode = d;

  // Find connected nodes and links
  const connected = new Set([d.id]);
  const connectedLinks = new Set();
  links.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id) { connected.add(tid); connectedLinks.add(l); }
    if (tid === d.id) { connected.add(sid); connectedLinks.add(l); }
  });

  node.classed('dimmed', n => !connected.has(n.id));
  link.classed('dimmed', l => !connectedLinks.has(l));
  node.select('circle').attr('stroke-width', n => connected.has(n.id) ? 3 : 1.5);

  // Info panel
  const panel = document.getElementById('info-panel');
  const connCount = connected.size - 1;
  panel.innerHTML = `<span class="ip-close" onclick="document.getElementById('info-panel').classList.remove('show')">&times;</span>
    <h3>${d.name}</h3>
    ${d.portuguese ? `<div class="ip-pt">${d.portuguese}</div>` : ''}
    <div class="ip-desc">${d.description || ''}</div>
    <div class="ip-stats">
      <div class="ip-stat">板块: <b>${sectionShort[d.section] || d.section}</b></div>
      <div class="ip-stat">权重: <b>${d.weight}</b></div>
      <div class="ip-stat">关联: <b>${connCount}</b></div>
    </div>`;
  panel.classList.add('show');
});

// Click empty - deselect
svg.on('click', () => {
  if (selectedNode) {
    selectedNode = null;
    node.classed('dimmed', false);
    link.classed('dimmed', false);
    link.classed('hl', false);
    node.select('circle').attr('stroke-width', 1.5);
    document.getElementById('info-panel').classList.remove('show');
  }
});

// ===== Search =====
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    node.classed('dimmed', false);
    link.classed('dimmed', false);
    node.select('circle').attr('stroke-width', 1.5);
    return;
  }
  const matched = new Set();
  nodes.forEach(n => {
    if (n.name.toLowerCase().includes(q) || (n.portuguese && n.portuguese.toLowerCase().includes(q))) {
      matched.add(n.id);
    }
  });
  node.classed('dimmed', n => !matched.has(n.id));
  link.classed('dimmed', l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    return !matched.has(sid) && !matched.has(tid);
  });
});

// ===== Control Buttons =====
document.getElementById('btn-labels').addEventListener('click', function() {
  showLabels2 = !showLabels2;
  this.classList.toggle('active', showLabels2);
  d3.selectAll('.node-label').style('display', showLabels2 ? 'block' : 'none');
});
document.getElementById('btn-solid').addEventListener('click', function() {
  showSolid = !showSolid;
  this.classList.toggle('active', showSolid);
  updateVisibility();
});
document.getElementById('btn-dashed').addEventListener('click', function() {
  showDashed = !showDashed;
  this.classList.toggle('active', showDashed);
  updateVisibility();
});
document.getElementById('btn-zoom-in').addEventListener('click', () => {
  svg.transition().call(zoom.scaleBy, 1.4);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  svg.transition().call(zoom.scaleBy, 0.7);
});
document.getElementById('btn-reset').addEventListener('click', () => {
  svg.transition().call(zoom.transform, d3.zoomIdentity);
  // Reheat simulation
  sim.alpha(0.8).restart();
});

// ===== Tick =====
sim.on('tick', () => {
  link.attr('d', d => {
    const sx = d.source.x, sy = d.source.y;
    const tx = d.target.x, ty = d.target.y;
    // Slight curve
    const dx = tx - sx, dy = ty - sy;
    const dr = Math.sqrt(dx*dx + dy*dy);
    if (dr < 1) return `M${sx},${sy}L${tx},${ty}`;
    const curveR = dr * 1.5;
    return `M${sx},${sy}A${curveR},${curveR} 0 0,1 ${tx},${ty}`;
  });
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ===== Drag =====
function dragStart(event, d) {
  if (!event.active) sim.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnd(event, d) {
  if (!event.active) sim.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Show labels after initial layout settles
setTimeout(() => {
  sim.alphaTarget(0);
}, 3000);

// Fade in the graph
requestAnimationFrame(() => { svg.style('opacity', 1); });

// Handle window resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('viewBox', `0 0 ${w} ${h}`);
  sim.force('center', d3.forceCenter(w / 2, h / 2));
  sim.force('radial', d3.forceRadial(d => {
    if (d.section === '中心主题') return 0;
    return 240 + (90 - d.weight) * 3;
  }, w / 2, h / 2).strength(0.3));
  sim.alpha(0.3).restart();
});
</script>
