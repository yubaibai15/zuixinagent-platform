<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>客户画像与跨境营销优化看板</title>
  <style>
    html,body{margin:0;background:#09131c;font-family:"Microsoft YaHei",sans-serif}
    .back{position:fixed;z-index:3;top:16px;left:16px;display:inline-block;padding:11px 16px;border-radius:10px;background:#fff;color:#07543e;text-decoration:none;font-weight:700;box-shadow:0 8px 24px #0005}
    main{scroll-snap-type:y mandatory;overflow-y:auto;height:100vh}
    .board{position:relative;height:100vh;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;background:#09131c}
    .board img{display:block;width:100%;height:100%;object-fit:contain;background:#09131c}
    .label{position:absolute;z-index:2;right:18px;bottom:16px;padding:7px 11px;border-radius:999px;background:#ffffffd9;color:#07543e;font-size:12px;font-weight:700}
    .hint{position:fixed;z-index:3;right:18px;top:18px;padding:8px 12px;border-radius:999px;background:#ffffffd9;color:#07543e;font-size:12px;pointer-events:none}
    @media(max-width:720px){.back{top:10px;left:10px;padding:8px 11px;font-size:12px}.hint{display:none}.label{right:10px;bottom:10px;font-size:11px}}
  </style>
</head>
<body>
  <a class="back" href="javascript:history.back()">← 返回数据分析助手</a>
  <span class="hint">向下滚动查看第二张全屏看板 ↓</span>
  <main aria-label="客户画像与跨境营销优化看板">
    <section class="board" aria-label="客户画像数据看板"><img src="/assets/results/customer-profile-dashboard.png" alt="客户画像数据看板"><span class="label">01 / 客户画像看板</span></section>
    <section class="board" aria-label="跨境营销优化全景看板"><img src="/assets/results/customer-marketing-optimization-dashboard.png" alt="A企业跨境营销优化全景看板"><span class="label">02 / 跨境营销优化看板</span></section>
  </main>
</body>
</html>
